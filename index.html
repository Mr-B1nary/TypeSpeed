<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TypeSpeed</title>
    <link rel="stylesheet" href="css.css">

</head>

<body>
    <header class="masthead">
        <h1>Type speed test</h1>
    </header>
    <main class="main">
        <article class="intro">
            <p dir="ltr">
                The typing speed assessment process works as follows:
                the timer starts counting as soon as the user begins typing,
                and with each character typed, the user's input is checked against the displayed text.</p>
        </article>
        <section class="test-area">
            <div class="pattern" dir="ltr">
               Template text:
            </div>
            <div id="origin-text">
                <p>The text just for test your Type speed.</p>
            </div>

            <div class="test-wrapper">
                <textarea id="test-area" name="textarea" rows="6"
                    placeholder=" The timer starts counting as soon as the first letter is typed."></textarea>
            </div>

            <div class="meta">
                <section id="clock">
                    <div class="timer">00:00:00</div>
                </section>

                <button id="reset">Anew</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
